name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: 后端测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      # 测试全程离线：TF-IDF 替代句向量、不预热重资源、不连 Neo4j/Redis
      EMBEDDING_BACKEND: tfidf
      WARMUP_ENABLED: 'false'
      MCP_ENABLED: 'false'
      USE_OLLAMA: 'false'
      NEO4J_URI: bolt://127.0.0.1:1
      REDIS_URL: ''
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装测试依赖
        run: pip install -r backend/requirements-dev.txt
      - name: 语法检查
        run: python -m compileall backend/app
      - name: 运行单测 + 集成测试
        run: |
          cd backend
          pytest -q --durations=10
      - name: 启动耗时门禁（create_app 不加载重资源）
        run: python scripts/check_startup_budget.py

      - name: 置信度门控有效性门禁
        run: |
          # 防止阈值被调回失效区间（低于全部样本置信度），导致"门控装了但没通电"。
          # 详见 scripts/check_gate_effective.py 顶部注释里记录的真实事故。
          python scripts/check_gate_effective.py --report docs/evaluation/latest_report.json

  frontend-build:
    name: 前端构建 (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: |
          cd frontend
          npm ci
      - name: 构建
        run: |
          cd frontend
          npm run build
