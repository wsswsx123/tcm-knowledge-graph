# 中医体质辨识智能诊疗系统 — 一键部署编排
# 启动：docker compose up -d --build
# 前端 http://localhost:80   后端 http://localhost:5000
# Neo4j Browser http://localhost:7474
#
# 可通过项目根目录 .env 覆盖以下变量（示例见 .env.example）：
#   SECRET_KEY / MYSQL_ROOT_PASSWORD / NEO4J_PASSWORD / OLLAMA_MODEL / AUTH_REQUIRED

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: tcm_health
      # PyMySQL 1.1+ 支持 caching_sha2_password；如遇兼容问题可取消下行注释
      # MYSQL_AUTHENTICATION_PLUGIN: mysql_native_password
      TZ: Asia/Shanghai
    ports:
      # 仅绑定本机回环，避免数据库直接暴露公网
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  neo4j:
    image: neo4j:4.4
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      TZ: Asia/Shanghai
    ports:
      # 仅绑定本机回环
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-password} 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # 一次性：向 Neo4j 导入知识图谱（1554 节点）。幂等：若已存在节点则跳过。
  kg-init:
    image: neo4j:4.4
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./data/init_neo4j.cypher:/init.cypher:ro
    entrypoint: ["/bin/sh", "-c", "COUNT=$(cypher-shell -a bolt://neo4j:7687 -u neo4j -p ${NEO4J_PASSWORD:-password} 'MATCH (n) RETURN count(n) AS c' --format plain 2>/dev/null | tail -1); if [ \"$$COUNT\" -gt 0 ] 2>/dev/null; then echo \"知识图谱已存在 ($$COUNT 节点)，跳过导入\"; else echo \"首次启动，导入知识图谱...\"; cypher-shell -a bolt://neo4j:7687 -u neo4j -p ${NEO4J_PASSWORD:-password} -f /init.cypher; fi"]
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    # 如需使用 GPU 加速（宿主机需安装 nvidia-container-toolkit），取消下行注释：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # 一次性：拉取 Qwen2.5-3B 模型（首次 ~5-10 分钟，已下载则秒过）
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do echo waiting-for-ollama; sleep 3; done; echo '拉取模型 ${OLLAMA_MODEL:-qwen2.5:3b}（首次约 5-10 分钟）...'; ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}; echo '模型就绪'"]
    restart: "no"

  redis:
    image: redis:7-alpine
    # 启用密码认证（REDIS_PASSWORD 未设置时使用默认 demo 密码，生产请务必在 .env 覆盖）
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-tcm_redis_demo}"]
    ports:
      # 仅绑定本机回环
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-tcm_redis_demo} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/tcm_health
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      # 管理员引导账号（首次启动自动创建，角色 admin）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # LLM：走 Ollama（容器内互联）
      USE_OLLAMA: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      # RAG 句向量：使用镜像构建时预下载的 HF 缓存模型
      EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      RAG_DATA_DIR: /app/data/rag
      # 多 Agent
      CONFIDENCE_THRESHOLD: "0.6"
      TOOL_TIMEOUT: "60.0"
      TOOL_MAX_RETRIES: "3"
      # MCP
      MCP_ENABLED: "true"
      MCP_CONNECT_TIMEOUT: "60"
      # 安全：生产默认强制 JWT 鉴权；演示可用 .env 设 AUTH_REQUIRED=false
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # 会话与限流共用 Redis（带密码）
      REDIS_URL: redis://:${REDIS_PASSWORD:-tcm_redis_demo}@redis:6379/0
      SESSION_TTL: "86400"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kg-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      # MCP 握手 + RAG/embedding 加载 + warmup 约需 20-40s
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mysql_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  redis_data:
  backend_logs:
